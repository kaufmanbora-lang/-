services:
  - type: web
    name: orbit-chat
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_LOGIN_PASSWORD
        generateValue: true
      - key: ADMIN_LOGIN_EMAIL
        value: admin@orbit.local
      - key: PUBLIC_APP_URL
        value: https://orbit-chat-qdmx.onrender.com
